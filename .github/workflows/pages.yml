name: Publier sur GitHub Pages

# Publie le site statique de la branche de développement sur GitHub Pages.
# La première exécution active Pages sur le dépôt (enablement: true).

on:
  push:
    branches:
      - claude/microtaches-site-full-0p25st
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les exécutions en attente sont remplacées.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Régénérer les pages depuis build.py
        run: python3 build.py

      - name: Vérifier que l'accueil ne mentionne aucun tarif
        run: |
          if grep -qiE '20,00 ?€|activation du compte' index.html; then
            echo "La page d'accueil ne doit comporter aucune mention tarifaire." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

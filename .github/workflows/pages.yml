name: Publier sur GitHub Pages

# Déploiement du site statique sur GitHub Pages.
# Uniquement depuis main : l'environnement github-pages n'autorise pas les
# déploiements depuis les autres branches. Le travail se fait sur la branche
# de développement, la publication se fait à la fusion.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Régénérer les pages depuis build.py
        run: python3 build.py

      - name: Vérifier que l'accueil ne mentionne aucun tarif
        run: |
          if grep -qiE '20,00 ?€|activation du compte' index.html; then
            echo "La page d'accueil ne doit comporter aucune mention tarifaire." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
